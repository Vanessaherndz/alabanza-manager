# Mantiene despierto el backend en Render (plan gratis), que se apaga tras
# ~15 min sin trafico y luego tarda ~30s en responder la primera peticion.
name: Keep backend awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        run: curl -fsS --max-time 90 --retry 2 https://alabanza-manager-api-t0jr.onrender.com/health
